name: Kagami
options:
  bundleIdPrefix: com.kagami
  deploymentTarget:
    visionOS: "26.0"
  createIntermediateGroups: true

targets:
  Kagami:
    type: application
    platform: visionOS
    sources:
      - path: Sources
        excludes:
          # Tools/stamp-build.sh writes this straight into the built product
          # (CODESIGNING_FOLDER_PATH) instead of relying on a Copy Bundle Resources
          # file reference — see that script's comment for why. Excluding it here
          # keeps the generated project the same whether or not the gitignored
          # source-tree copy happens to exist when `xcodegen generate` runs.
          - "Resources/BuildInfo.json"
    preBuildScripts:
      - name: Stamp build info
        script: |
          "$SRCROOT/Tools/stamp-build.sh"
        # No declared output: the script must run on every build, not just when
        # xcodegen thinks its inputs changed.
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kagami.app
        CODE_SIGN_STYLE: Automatic
        # His own personal account (miguel@keepok.com.br) has no session in Xcode
        # right now — the dad's org team is what's actually signed in and working
        # as of this build. Switch back once the personal account logs in again.
        DEVELOPMENT_TEAM: SW36PU2B3T
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.2"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kagami
        # Reaching the console is the whole app, and visionOS refuses the connection
        # outright without this string.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Kagami connects to your console on the local network to show its screen."
        DEVELOPMENT_ASSET_PATHS: ""

  KagamiUITests:
    type: bundle.ui-testing
    platform: visionOS
    sources:
      - path: Tests/KagamiUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kagami.app.uitests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Kagami

schemes:
  Kagami:
    build:
      targets:
        Kagami: all
    run:
      config: Release
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - KagamiUITests
